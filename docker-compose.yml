services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      groq-ollama:
        condition: service_healthy
      deepseek-ollama:
        condition: service_healthy
    volumes:
      # Mount local data/ so cv.md is available and seen_urls.json persists
      - ./data:/app/data
    networks:
      netjob:
        ipv4_address: 172.24.0.5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local replacement for DeepSeek — serves the specialized "ollama-deepseek" model (CV analysis)
  deepseek-ollama:
    build:
      context: .
      dockerfile: ollamadeepseek/Dockerfile
    container_name: deepseek-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      netjob:
        ipv4_address: 172.24.0.6
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local replacement for Groq — serves the specialized "ollama-groq" model (boolean triage)
  groq-ollama:
    build:
      context: .
      dockerfile: ollamagroq/Dockerfile
    container_name: groq-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      netjob:
        ipv4_address: 172.24.0.7
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  netjob:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16
