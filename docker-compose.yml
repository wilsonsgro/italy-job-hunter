services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      groq-ollama:
        condition: service_healthy
      deepseek-ollama:
        condition: service_healthy
    volumes:
      # Mount local data/ so cv.md is available and seen_urls.json persists
      - ./data:/app/data
    networks:
      netjob:
        ipv4_address: 172.24.0.5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local replacement for DeepSeek — serves the specialized "ollama-deepseek" model (CV analysis)
  deepseek-ollama:
    build:
      context: .
      dockerfile: ollamadeepseek/Dockerfile
    container_name: deepseek-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # 0 = unload the model right after each request. On a 3 GB GPU this keeps the two
      # models (groq + deepseek) from being resident at once, so each runs 100% on GPU
      # instead of spilling to CPU. Trade-off: a model reload between phases.
      OLLAMA_KEEP_ALIVE: 0
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
    ports:
        - "11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      netjob:
        ipv4_address: 172.24.0.6
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local replacement for Groq — serves the specialized "ollama-groq" model (boolean triage)
  groq-ollama:
    build:
      context: .
      dockerfile: ollamagroq/Dockerfile
    container_name: groq-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11435
      # 0 = unload the model right after each request. On a 3 GB GPU this keeps the two
      # models (groq + deepseek) from being resident at once, so each runs 100% on GPU
      # instead of spilling to CPU. Trade-off: a model reload between phases.
      OLLAMA_KEEP_ALIVE: 0
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
    ports:
        - "11435"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11435/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      netjob:
        ipv4_address: 172.24.0.7
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dozzlejob:
    container_name: dozzlejob
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8087:8080"
    networks:
      netjob:
        ipv4_address: 172.24.0.17

  run:
    image: node:25-alpine3.23
    restart: unless-stopped
    dns:
      - 8.8.8.8
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    env_file:
      - .env
    environment:
      HUNTER_HOST: 0.0.0.0
      HUNTER_PORT: 3000
      HUNTER_RUN_ON_STARTUP: "true"
      HUNTER_INTERVAL_MS: "0"
    depends_on:
      groq-ollama:
        condition: service_healthy
      deepseek-ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      netjob:
        ipv4_address: 172.24.0.18

networks:
  netjob:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16
